name: 'Upload Escrow Asset'
description: 'Uploads an escrow asset to the cfx portal'
author: 'Lukas Leisten'

branding:
  icon: 'upload-cloud'
  color: 'gray-dark'

inputs:
  cookie:
    description: 'Your Forum Account Cookie'
    required: true
  makeZip:
    description:
      'Automatically zip the full repository to upload it (true or false)'
    required: false
    default: true
  assetName:
    description: 'The asset name to re-upload'
    required: false
  maxRetries:
    description:
      'Attempts for the portal login AND for each individual chunk upload. Chunk
      retries back off exponentially (2s, 4s, 8s ... capped at 30s), so raising
      this widens the outage a large upload can survive rather than just
      retrying faster.'
    required: false
    default: 3
  zipPath:
    description: 'The path to the zip file to upload'
    required: false
  assetId:
    description: 'The asset id to re-upload'
    required: false
  beta:
    description: 'Whether to upload as a release candidate'
    required: false
  changelog:
    description: 'The changelog for the new version'
    required: false
  changelogFile:
    description: 'The path to a file containing the changelog'
    required: false
  deleteOlderVersions:
    description: 'Delete older versions of the asset after upload'
    required: false
    default: false
  keepVersions:
    description:
      'How many newest versions to keep when deleteOlderVersions is true
      (includes the just-uploaded one). Older versions are pruned once the new
      upload clears escrow. Defaults to 1 (keep only the newest, the prior
      behaviour); increase to retain rollback versions.'
    required: false
    default: 1
  skipUpload:
    description: 'Skip the upload and only go through the login process'
    required: false
  chunkSize:
    description: 'The chunk size to split the file into'
    required: false
    default: 2097152
  discordWebhook:
    description:
      'Optional Discord webhook URL. When set, the action waits for the uploaded
      version to clear escrow (go live) and posts a message to Discord — or a
      "still processing" notice if it does not go live within escrowTimeout.'
    required: false
  escrowTimeout:
    description:
      'Max seconds to wait for the uploaded version to leave escrow before
      sending the "still processing" Discord notice (only used with
      discordWebhook).'
    required: false
    default: 900

runs:
  using: node24
  main: dist/index.mjs
